{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">{{ title }}</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input name="name" class="form-control" value="{{ product.get('name', '') if product else '' }}" required>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Quantity</label>
              <input name="quantity" type="number" min="0" class="form-control" value="{{ product.get('quantity', '') if product else '' }}" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Price (₹)</label>
              <input name="price" type="number" step="0.01" min="0" class="form-control" value="{{ product.get('price', '') if product else '' }}" required>
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Manufacturing Date</label>
              <input name="mfg_date" type="date" class="form-control" value="{{ product.get('mfg_date', '') if product else '' }}" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Expiry Date</label>
              <input name="expiry_date" type="date" class="form-control" value="{{ product.get('expiry_date', '') if product else '' }}" required>
            </div>
          </div>
          <button class="btn btn-success">Save</button>
          <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
